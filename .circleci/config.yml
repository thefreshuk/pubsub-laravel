version: 2.1

# CI for thefreshuk/pubsub-laravel (a library: tests run against freshly
# resolved dependencies, not composer.lock). No secrets are required: both
# this repo and the validator fork are public. Optionally set GITHUB_TOKEN in
# the CircleCI project to avoid Composer's anonymous GitHub rate limits.
#
# Releases: pushing a tag like v4.0.0 runs the full suite and then the
# `release` job, which creates a GitHub Release with generated notes if one
# does not already exist (so a Release created by hand in the GitHub UI is left
# untouched). It needs GITHUB_RELEASE_TOKEN (see the release job).

executors:
  php:
    parameters:
      version:
        type: string
    docker:
      - image: cimg/php:<< parameters.version >>
    working_directory: ~/project

commands:
  composer-install:
    description: Resolve dependencies for one Laravel line (Testbench 8 = Laravel 10, Testbench 9 = Laravel 11)
    parameters:
      laravel:
        type: string
        default: "11"
    steps:
      - restore_cache:
          keys:
            - composer-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}
            - composer-v1-{{ .Environment.CIRCLE_JOB }}-
      - run:
          name: Configure Composer
          command: |
            # GITHUB_TOKEN is optional
            if [ -n "$GITHUB_TOKEN" ]; then composer config -g github-oauth.github.com "$GITHUB_TOKEN"; fi
            # The committed platform pin (php 8.2) must not hide real PHP/dependency conflicts in the matrix
            composer config --unset platform.php
            case "<< parameters.laravel >>" in
              10) TESTBENCH="^8.0" ;;
              11) TESTBENCH="^9.0" ;;
              *) echo "Unsupported Laravel version << parameters.laravel >>"; exit 1 ;;
            esac
            composer require --no-update --dev "orchestra/testbench:$TESTBENCH"
      - run:
          name: Install dependencies
          command: composer update --no-interaction --no-progress --prefer-dist
      - save_cache:
          key: composer-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}
          paths:
            - ~/.composer/cache

jobs:
  validate:
    executor:
      name: php
      version: "8.3"
    steps:
      - checkout
      - run: composer validate
      - composer-install
      - run:
          name: Security audit
          command: composer audit

  test:
    parameters:
      php:
        type: string
      laravel:
        type: string
    executor:
      name: php
      version: << parameters.php >>
    steps:
      - checkout
      - composer-install:
          laravel: << parameters.laravel >>
      - run:
          name: Show resolved versions
          command: composer show laravel/framework phpunit/phpunit | grep -E '^(name|versions)'
      - run:
          name: PHPUnit
          command: vendor/bin/phpunit --log-junit ~/test-results/phpunit/junit.xml
      - store_test_results:
          path: ~/test-results

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Create GitHub Release if missing
          command: |
            : "${GITHUB_RELEASE_TOKEN:?Set GITHUB_RELEASE_TOKEN in the CircleCI project (a token with contents:write on this repo)}"
            TAG="$CIRCLE_TAG"
            API="https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
            AUTH="Authorization: Bearer $GITHUB_RELEASE_TOKEN"
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG")
            if [ "$STATUS" = "200" ]; then
              echo "Release $TAG already exists; nothing to do."
              exit 0
            elif [ "$STATUS" != "404" ]; then
              echo "Unexpected status $STATUS looking up release $TAG"; exit 1
            fi
            BODY=$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag, generate_release_notes: true}')
            STATUS=$(curl -s -o /tmp/release.json -w '%{http_code}' -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" -d "$BODY" "$API/releases")
            if [ "$STATUS" != "201" ]; then cat /tmp/release.json; echo "Failed to create release (HTTP $STATUS)"; exit 1; fi
            echo "Created release: $(jq -r .html_url /tmp/release.json)"

workflows:
  ci:
    jobs:
      - validate:
          filters: &all
            tags:
              only: /.*/
      - test:
          name: php<< matrix.php >>-laravel<< matrix.laravel >>
          matrix:
            alias: test
            parameters:
              php: ["8.2", "8.3"]
              laravel: ["10", "11"]
          filters: *all
      - release:
          requires: [validate, test]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
